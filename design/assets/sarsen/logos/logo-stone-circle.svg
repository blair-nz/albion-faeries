<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Radical Faeries of Albion - Stone Circle</title>
  <desc id="desc">A circular plan of standing stones around a dawn hearth, with the Radical Faeries of Albion wordmark.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .wm-main {
        font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.04em;
        fill: #1a1f1c;
      }
      .wm-sub {
        font-family: "Figtree", "Segoe UI", Tahoma, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.34em;
        fill: #3a3530;
      }
    ]]></style>
    <radialGradient id="hearth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#f09a42"/>
      <stop offset="100%" stop-color="#e25d52"/>
    </radialGradient>
  </defs>

  <!-- Mark: aerial stone circle (henge plan) -->
  <g transform="translate(320, 100)">
    <!-- Soft chalk disc -->
    <circle cx="0" cy="0" r="88" fill="#c5d2bf" opacity="0.35"/>

    <!-- Bank / ditch ring -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#3d7a8c" stroke-width="2" opacity="0.45"/>

    <!-- Dawn rising through the east opening -->
    <circle cx="52" cy="0" r="16" fill="url(#hearth)"/>
    <circle cx="52" cy="0" r="8" fill="#ffd166" opacity="0.85"/>

    <!-- Outer sarsen circle (plan: radial blocks), open to the east -->
    <g fill="#3a3530">
      <rect x="-5" y="-82" width="10" height="22" rx="2"/>
      <g transform="rotate(-45)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
      <g transform="rotate(45)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
      <g transform="rotate(135)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
      <g transform="rotate(180)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
      <g transform="rotate(-135)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
      <g transform="rotate(-90)"><rect x="-5" y="-82" width="10" height="22" rx="2"/></g>
    </g>

    <!-- Inner horseshoe of trilithons (plan), open east -->
    <g fill="#6a645c">
      <g transform="rotate(-120)"><rect x="-4" y="-42" width="8" height="18" rx="2"/></g>
      <g transform="rotate(-150)"><rect x="-4" y="-42" width="8" height="18" rx="2"/></g>
      <g transform="rotate(120)"><rect x="-4" y="-42" width="8" height="18" rx="2"/></g>
      <g transform="rotate(150)"><rect x="-4" y="-42" width="8" height="18" rx="2"/></g>
      <g transform="rotate(180)"><rect x="-4" y="-42" width="8" height="18" rx="2"/></g>
    </g>

    <!-- Centre altar stone -->
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="#3a3530"/>
    <ellipse cx="-2" cy="-1" rx="4" ry="2" fill="#e8ebe3" opacity="0.2"/>

    <!-- Lichen accents -->
    <circle cx="-30" cy="-48" r="2.5" fill="#5f8a4e" opacity="0.55"/>
    <circle cx="24" cy="50" r="2" fill="#5f8a4e" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text class="wm-main" x="320" y="248" text-anchor="middle">Radical Faeries</text>
  <line x1="238" y1="260" x2="402" y2="260" stroke="#3d7a8c" stroke-width="1.5" stroke-linecap="round"/>
  <text class="wm-sub" x="320" y="284" text-anchor="middle">OF ALBION</text>
</svg>


