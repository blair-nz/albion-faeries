<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=/gatherings#whats-on" />
  <link rel="canonical" href="/gatherings#whats-on" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var hash = location.hash.replace(/^#/, "");
      if (hash === "heart-circle" || hash === "heart") {
        location.replace("/gatherings#" + hash);
      } else {
        location.replace("/gatherings#whats-on");
      }
    })();
  </script>
</head>
